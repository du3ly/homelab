name: Validate IaC

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'helm/**'
      - '.github/workflows/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Find Terraform directories
        id: tf-dirs
        run: |
          DIRS=$(find terraform -name "*.tf" -exec dirname {} \; | sort -u | tr '\n' ',')
          echo "dirs=${DIRS%,}" >> $GITHUB_OUTPUT

      - name: Run Terraform validation
        working-directory: ${{ github.workspace }}
        run: |
          for dir in $(echo "${{ steps.tf-dirs.outputs.dirs }}" | tr ',' ' '); do
            if [ -n "$dir" ]; then
              echo "Validating Terraform in: $dir"
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
              terraform fmt -check -recursive
              cd - > /dev/null
            fi
          done

  validate-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint

      - name: Find Ansible playbooks
        id: playbooks
        run: |
          PLAYBOOKS=$(find ansible -name "*.yml" -path "*/playbooks/*" | sort | tr '\n' ',')
          echo "playbooks=${PLAYBOOKS%,}" >> $GITHUB_OUTPUT

      - name: Run Ansible syntax check
        run: |
          for playbook in $(echo "${{ steps.playbooks.outputs.playbooks }}" | tr ',' ' '); do
            if [ -n "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook --syntax-check "$playbook"
            fi
          done

  validate-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@v1
        with:
          minikube version: v1.32.0
          kubernetes version: v1.28.0
          driver: docker

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Find Helm charts and manifests
        id: helm-files
        run: |
          # Check for proper Helm charts (directories with Chart.yaml)
          CHARTS=$(find helm -name "Chart.yaml" -exec dirname {} \; | sort | tr '\n' ',')
          # Check for raw YAML manifests in helm directory
          MANIFESTS=$(find helm -maxdepth 2 -name "*.yaml" -type f | grep -v "Chart.yaml" | grep -v "values.yaml" | sort | tr '\n' ',')
          echo "charts=${CHARTS%,}" >> $GITHUB_OUTPUT
          echo "manifests=${MANIFESTS%,}" >> $GITHUB_OUTPUT

      - name: Run Helm lint
        run: |
          for chart in $(echo "${{ steps.helm-files.outputs.charts }}" | tr ',' ' '); do
            if [ -n "$chart" ]; then
              echo "Linting Helm chart: $chart"
              helm lint "$chart"
            fi
          done

      - name: Run Helm template
        run: |
          for chart in $(echo "${{ steps.helm-files.outputs.charts }}" | tr ',' ' '); do
            if [ -n "$chart" ]; then
              echo "Templating Helm chart: $chart"
              helm template "$chart" --debug
            fi
          done

      - name: Validate Kubernetes manifests
        run: |
          # Start Minikube
          minikube start
          eval $(minikube docker-env)

          for manifest in $(echo "${{ steps.helm-files.outputs.manifests }}" | tr ',' ' '); do
            if [ -n "$manifest" ]; then
              echo "Validating manifest: $manifest"
              kubectl apply --dry-run=client -f "$manifest"
            fi
          done
