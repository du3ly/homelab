name: Validate Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to access base branch for diff

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Find modified Terraform directories
        id: tf-dirs
        run: |
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | tr '\n' ',')
          echo "dirs=${DIRS%,}" >> $GITHUB_OUTPUT

      - name: Run Terraform validation
        if: steps.tf-dirs.outputs.dirs != ''
        id: validate
        run: |
          OUTPUT=""
          FAILED=0
          for dir in $(echo "${{ steps.tf-dirs.outputs.dirs }}" | tr ',' ' '); do
            if [ -n "$dir" ]; then
              echo "Validating Terraform in: $dir"
              cd "$dir"

              # Init: suppress output unless it fails
              INIT_OUTPUT=$(terraform init -backend=false -input=false -no-color 2>&1)
              INIT_EXIT=$?

              if [ $INIT_EXIT -ne 0 ]; then
                OUTPUT="${OUTPUT}\n### ❌ \`${dir}\` (init failed)\n\`\`\`\n${INIT_OUTPUT}\n\`\`\`\n"
                FAILED=1
                cd - > /dev/null
                continue
              fi

              # Validate
              VALIDATE_OUTPUT=$(terraform validate -no-color 2>&1)
              VALIDATE_EXIT=$?

              # Fmt: collect unformatted files
              FMT_OUTPUT=$(terraform fmt -check -recursive -no-color 2>&1)
              FMT_EXIT=$?

              if [ $VALIDATE_EXIT -eq 0 ] && [ $FMT_EXIT -eq 0 ]; then
                OUTPUT="${OUTPUT}\n### ✅ \`${dir}\`\n"
              else
                FAILED=1
                DIR_DETAIL=""
                if [ $VALIDATE_EXIT -ne 0 ]; then
                  DIR_DETAIL="${DIR_DETAIL}\n**Validate failed:**\n\`\`\`\n${VALIDATE_OUTPUT}\n\`\`\`"
                fi
                if [ $FMT_EXIT -ne 0 ]; then
                  DIR_DETAIL="${DIR_DETAIL}\n**Formatting required on:**\n\`\`\`\n${FMT_OUTPUT}\n\`\`\`\n> Run \`terraform fmt -recursive\` to fix."
                fi
                OUTPUT="${OUTPUT}\n### ❌ \`${dir}\`\n${DIR_DETAIL}\n"
              fi

              cd - > /dev/null
            fi
          done
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo -e "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit $FAILED