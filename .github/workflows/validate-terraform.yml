name: Validate Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to access base branch for diff

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Find modified Terraform directories
        id: tf-dirs
        run: |
          DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -I{} dirname {} \
            | sort -u \
            | tr '\n' ',')
          echo "dirs=${DIRS%,}" >> $GITHUB_OUTPUT

      - name: Run Terraform validation
        if: steps.tf-dirs.outputs.dirs != ''
        working-directory: ${{ github.workspace }}
        run: |
          for dir in $(echo "${{ steps.tf-dirs.outputs.dirs }}" | tr ',' ' '); do
            if [ -n "$dir" ]; then
              echo "Validating Terraform in: $dir"
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
              terraform fmt -check -recursive
              cd - > /dev/null
            fi
          done