name: Validate Ansible

on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/**'

jobs:
  validate-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to access base branch for diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible ansible-lint

      - name: Find modified Ansible playbooks
        id: playbooks
        run: |
          PLAYBOOKS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.yml$' \
            | grep '.*/playbooks/.*' \
            | sort -u \
            | tr '\n' ',')
          echo "playbooks=${PLAYBOOKS%,}" >> $GITHUB_OUTPUT

      - name: Run Ansible syntax check
        if: steps.playbooks.outputs.playbooks != ''
        run: |
          for playbook in $(echo "${{ steps.playbooks.outputs.playbooks }}" | tr ',' ' '); do
            if [ -n "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook --syntax-check "$playbook"
            fi
          done