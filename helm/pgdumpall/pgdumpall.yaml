apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:15
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitwarden
                  key: db-001_password
            volumeMounts:
            - name: backup-nas
              mountPath: /backups
            command:
            - sh
            - -c
            - |
              set -e
              pg_dumpall -h 192.168.1.167 -U postgres | gzip > /backups/db-$(date +%F-%H%M).sql.gz
          restartPolicy: OnFailure
          volumes:
          - name: backup-nas
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
