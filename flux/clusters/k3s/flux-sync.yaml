apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k3s-manifests
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/duelyyung/homelab
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-manifests
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k3s
  prune: true
  sourceRef:
    kind: GitRepository
    name: k3s-manifests
  timeout: 5m
  wait: true
  retryInterval: 1m
  suspend: false
