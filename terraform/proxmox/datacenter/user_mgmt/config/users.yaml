roles:
  packer:
    name: Packer
    privileges:
      - Datastore.AllocateSpace
      - Datastore.AllocateTemplate
      - SDN.Use
      - Sys.Modify
      - VM.Allocate
      - VM.Audit
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Console
      - VM.Monitor
      - VM.PowerMgmt
  terraform_prov:
    name: TerraformProv
    privileges:
      - Datastore.Allocate
      - Datastore.AllocateSpace
      - Datastore.AllocateTemplate
      - Datastore.Audit
      - Permissions.Modify
      - Pool.Allocate
      - Pool.Audit
      - Realm.AllocateUser
      - SDN.Use
      - Sys.Audit
      - Sys.Console
      - Sys.Modify
      - User.Modify
      - VM.Allocate
      - VM.Audit
      - VM.Clone
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Console
      - VM.Migrate
      - VM.Monitor
      - VM.PowerMgmt

users:
  packer:
    username: packer
    description: Packer API user
    role: packer
    token_id: packer1
    acl_path: /
  terraform_prov:
    username: terraform-prov
    role: terraform_prov
    token_id: terraform1
    acl_path: /
