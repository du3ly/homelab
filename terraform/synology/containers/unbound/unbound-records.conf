server:
  # Network
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  prefer-ip6: no

  # Access control — restrict to your LAN
  access-control: 127.0.0.1/32 allow
  access-control: 10.0.0.0/8 allow
  access-control: 192.168.0.0/16 allow
  access-control: 0.0.0.0/0 refuse

  # Logging (set to 0 in production)
  verbosity: 1

  # Performance
  num-threads: 2
  cache-min-ttl: 300
  cache-max-ttl: 86400

  # Privacy / security
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: yes

  # Static records for the main DDNS domain
  local-zone: "duelylab.synology.me." static
  local-data: "duelylab.synology.me. IN A 192.168.1.21"

# Forward all other queries upstream (e.g. Cloudflare or your ISP)
forward-zone:
  name: "."
  forward-addr: 1.1.1.1
  forward-addr: 1.0.0.1
